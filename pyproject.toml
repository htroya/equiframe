[build-system]
requires = ["hatchling==1.28.0", "hatch-vcs==0.5.0", "setuptools-scm==10.3.4"]
build-backend = "hatchling.build"

[project]
name = "equiframe"
dynamic = ["version"]
description = "Operational verification, native ETL migration and portable semantic evidence"
keywords = ["dataframes", "semantic-diff", "data-validation", "etl", "pandas", "polars", "duckdb"]
readme = "README.en.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "tools/cyclonedx/LICENSE", "tools/cyclonedx/PROVENANCE.md"]
requires-python = ">=3.10,<3.14"
authors = [{ name = "Hernán Troya" }]
classifiers = ["Development Status :: 5 - Production/Stable", "Programming Language :: Python :: 3.10", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Operating System :: Microsoft :: Windows", "Operating System :: POSIX :: Linux", "Topic :: Software Development :: Libraries :: Python Modules", "Typing :: Typed"]
dependencies = ["typing-extensions>=4.14,<5", "pydantic>=2.12,<3", "typer>=0.20,<1", "tzdata>=2025.2,<2027"]

[project.urls]
Homepage = "https://github.com/htroya/equiframe"
Source = "https://github.com/htroya/equiframe"
Documentation = "https://github.com/htroya/equiframe/blob/main/docs/index.md"
"Issue Tracker" = "https://github.com/htroya/equiframe/issues"

[project.optional-dependencies]
ml = ["scikit-learn>=1.7,<1.10", "numpy>=2,<3"]
arrow = ["pyarrow>=23.0.1,<26"]
pandas = ["pandas>=2.2,<4,!=3.0.3,!=3.0.4,!=3.0.5,!=3.0.6", "pyarrow>=23.0.1,<26"]
polars = ["polars>=1.30,<2", "pyarrow>=23.0.1,<26"]
duckdb = ["duckdb>=1.5.6,<2", "pyarrow>=23.0.1,<26"]
engines = ["pandas>=2.2,<4,!=3.0.3,!=3.0.4,!=3.0.5,!=3.0.6", "polars>=1.30,<2", "duckdb>=1.5.6,<2", "pyarrow>=23.0.1,<26"]
files = ["pandas>=2.2,<4,!=3.0.3,!=3.0.4,!=3.0.5,!=3.0.6", "pyarrow>=23.0.1,<26", "openpyxl>=3.1,<4", "xlrd>=2,<3", "defusedxml>=0.7,<1"]
eda = ["duckdb>=1.5.6,<2", "pyarrow>=23.0.1,<26"]
eda-charts = ["duckdb>=1.5.6,<2", "pyarrow>=23.0.1,<26", "plotly>=6.3,<8"]

[project.scripts]
equiframe = "equiframe.cli:main"
equiframe-eda = "equiframe.eda.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "tomli>=2.2,<3; python_version < '3.11'",
  "hatchling==1.28.0",
  "hatch-vcs==0.5.0",
  "setuptools-scm==10.3.4",
  "hypothesis>=6.140,<7",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "pandas-stubs>=2.2,<4",
  "twine>=6.2,<7",
]

[tool.hatch.version]
source = "vcs"
tag-pattern = '^v(?P<version>(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*))$'

[tool.hatch.version.raw-options]
search_parent_directories = true
version_scheme = "no-guess-dev"

[tool.hatch.build.targets.wheel]
packages = ["src/equiframe"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "tools/reproducible_wheel.py"

[tool.hatch.build.targets.wheel.force-include]
"examples/load_convert_compare.py" = "equiframe/examples/load_convert_compare.py"
"docs" = "equiframe/docs"
"tools/cyclonedx" = "equiframe/_vendor/cyclonedx"
"schemas/r-review-options-1.0.schema.json" = "equiframe/schemas/r-review-options-1.0.schema.json"
"schemas/r-review-binding-1.0.schema.json" = "equiframe/schemas/r-review-binding-1.0.schema.json"
"schemas/r-execution-binding-1.0.schema.json" = "equiframe/schemas/r-execution-binding-1.0.schema.json"
"schemas/r-review-result-1.0.schema.json" = "equiframe/schemas/r-review-result-1.0.schema.json"
"schemas/reviewed-decision-1.0.schema.json" = "equiframe/schemas/reviewed-decision-1.0.schema.json"
"examples/journeys/README.md" = "equiframe/examples/journeys/README.md"
"examples/journeys/__init__.py" = "equiframe/examples/journeys/__init__.py"
"examples/journeys/a_pandas_refactor.py" = "equiframe/examples/journeys/a_pandas_refactor.py"
"examples/journeys/b_native_migration.py" = "equiframe/examples/journeys/b_native_migration.py"
"examples/journeys/c_retail_etl.py" = "equiframe/examples/journeys/c_retail_etl.py"
"examples/journeys/common.py" = "equiframe/examples/journeys/common.py"
"examples/journeys/d_financial_reconciliation.py" = "equiframe/examples/journeys/d_financial_reconciliation.py"
"examples/journeys/e_telemetry.py" = "equiframe/examples/journeys/e_telemetry.py"
"examples/journeys/f_data_science_preparation.py" = "equiframe/examples/journeys/f_data_science_preparation.py"
"examples/journeys/g_external_snapshots.py" = "equiframe/examples/journeys/g_external_snapshots.py"
"examples/journeys/h_portable_ci.py" = "equiframe/examples/journeys/h_portable_ci.py"
"examples/journeys/requirements.lock" = "equiframe/examples/journeys/requirements.lock"
"examples/journeys/verify_journeys.py" = "equiframe/examples/journeys/verify_journeys.py"
"examples/integrations/outcome_gates.py" = "equiframe/examples/integrations/outcome_gates.py"
"examples/integrations/sqlite_snapshot.py" = "equiframe/examples/integrations/sqlite_snapshot.py"
"examples/integrations/sqlite_snapshot_demo.py" = "equiframe/examples/integrations/sqlite_snapshot_demo.py"
"examples/integrations/universal_first_use.py" = "equiframe/examples/integrations/universal_first_use.py"
"examples/eda_generic.py" = "equiframe/examples/integrations/eda_generic.py"

[tool.hatch.build.targets.sdist]
ignore-vcs = true
include = ["/docs", "/src", "/tests", "/examples", "/schemas", "/tools", "/pyproject.toml", "/uv.lock", "/README.md", "/README.en.md", "/CHANGELOG.md", "/LICENSE", "/THIRD_PARTY_NOTICES.md"]
exclude = ["/.private/**", "/infra/**", "/qa/**", "/services/**", "/components/**", "/componentes/**", "/data/**", "/datasets/**", "/models/**", "/reports/**", "/validation/**", "/packages/**", "/.github/**"]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "tools/reproducible_wheel.py"

# Historical synthetic evidence is intentionally shipped despite the repository's
# global data-file ignores; the closed fixture inventory validates every byte.
[tool.hatch.build.targets.sdist.force-include]
"tests/fixtures/versioned" = "tests/fixtures/versioned"
"tests/fixtures/option_trace" = "tests/fixtures/option_trace"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [".private", "infra", "qa", "services", "components", "componentes", "data", "datasets", "models", "reports", "validation", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
# Use the interpreter selected by uv so stdlib and PEP 561 stubs share its syntax level.
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*", "duckdb", "duckdb.*", "plotly", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["equiframe._report_io"]
# This POSIX-only attribute is reached only when os.open supports directory file descriptors.
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
