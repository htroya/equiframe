{
  "name": "EquiFrame quick source checks",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "equiframe-quick-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quick": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "PYTHONUTF8": "1",
        "UV_PYTHON_DOWNLOADS": "never"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install pinned dependency manager",
          "run": "python -m pip install uv==0.12.19"
        },
        {
          "name": "Install locked core checks",
          "working-directory": "packages/equiframe",
          "run": "uv sync --locked --all-extras --no-editable --python 3.12"
        },
        {
          "name": "Check core source and repository contracts",
          "working-directory": "packages/equiframe",
          "run": "uv run --locked --all-extras python tools/quick_check.py --package core"
        },
        {
          "name": "Install locked benchmark checks",
          "working-directory": "packages/equiframe-benchmark",
          "run": "uv sync --locked --all-extras --no-editable --reinstall-package equiframe --python 3.12"
        },
        {
          "name": "Check benchmark source and independence",
          "working-directory": "packages/equiframe-benchmark",
          "run": "uv run --locked --all-extras python ../equiframe/tools/quick_check.py --package benchmark"
        }
      ]
    }
  }
}
