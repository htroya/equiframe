{
  "name": "EquiFrame quick source checks",
  "on": {
    "pull_request": {
      "paths": [
        ".github/workflows/**",
        "packages/equiframe/**",
        "packages/equiframe-benchmark/**",
        "tests/**",
        "install_deps_alma9.sh",
        "AGENTS.md",
        "README.md",
        "CONTRIBUTING.md",
        "docs/**"
      ]
    },
    "push": {
      "paths": [
        ".github/workflows/**",
        "packages/equiframe/**",
        "packages/equiframe-benchmark/**",
        "tests/**",
        "install_deps_alma9.sh",
        "AGENTS.md",
        "README.md",
        "CONTRIBUTING.md",
        "docs/**"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "equiframe-quick-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "quick": {
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 15,
      "env": {
        "PYTHONUTF8": "1",
        "UV_PYTHON_DOWNLOADS": "never"
      },
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "name": "Install pinned dependency manager",
          "run": "python -m pip install --no-deps uv==0.11.6"
        },
        {
          "name": "Install locked core checks",
          "working-directory": "packages/equiframe",
          "run": "uv sync --locked --all-extras --python 3.12"
        },
        {
          "name": "Check core source and repository contracts",
          "working-directory": "packages/equiframe",
          "run": "uv run --locked --all-extras python tools/quick_check.py --package core"
        },
        {
          "name": "Install locked benchmark checks",
          "working-directory": "packages/equiframe-benchmark",
          "run": "uv sync --locked --all-extras --reinstall-package equiframe --python 3.12"
        },
        {
          "name": "Check benchmark source and independence",
          "working-directory": "packages/equiframe-benchmark",
          "run": "uv run --locked --all-extras python ../equiframe/tools/quick_check.py --package benchmark"
        }
      ]
    }
  }
}
