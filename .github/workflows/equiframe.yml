name: EquiFrame native universality matrix

on:
  workflow_dispatch:
    inputs:
      run_platform_matrix:
        description: 'Run all 20 native cells; consumes GitHub Actions minutes'
        type: boolean
        required: true
        default: false
      consumer_repository:
        description: 'owner/repository containing the independent consumer (read-only checkout)'
        type: string
        required: true
      consumer_commit:
        description: 'Exact 40-character consumer commit SHA'
        type: string
        required: true
      consumer_data_repository:
        description: 'owner/repository containing the frozen public corpus (read-only checkout)'
        type: string
        required: true
      consumer_data_commit:
        description: 'Exact 40-character frozen-data commit SHA'
        type: string
        required: true
      consumer_data_path:
        description: 'Repository-relative directory containing manifest.json'
        type: string
        required: true
        default: '.'

permissions:
  contents: read
  actions: read

concurrency:
  group: equiframe-universality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    name: Enforce private, allowlisted validation inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Reject public, unprotected or mutable validation inputs
        env:
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
          WORKFLOW_REF_NAME: ${{ github.ref }}
          ALLOWED_CONSUMER_REPOSITORY: ${{ vars.UNIVERSALITY_CONSUMER_REPOSITORY }}
          ALLOWED_DATA_REPOSITORY: ${{ vars.UNIVERSALITY_DATA_REPOSITORY }}
          ALLOWED_VALIDATION_REF: ${{ vars.UNIVERSALITY_VALIDATION_REF }}
          REQUESTED_CONSUMER_REPOSITORY: ${{ inputs.consumer_repository }}
          REQUESTED_DATA_REPOSITORY: ${{ inputs.consumer_data_repository }}
          CONSUMER_COMMIT: ${{ inputs.consumer_commit }}
          DATA_COMMIT: ${{ inputs.consumer_data_commit }}
          READ_TOKEN: ${{ secrets.UNIVERSALITY_READ_TOKEN }}
        run: |
          test "$REPOSITORY_PRIVATE" = true
          test -n "$ALLOWED_VALIDATION_REF"
          test "$WORKFLOW_REF_NAME" = "$ALLOWED_VALIDATION_REF"
          test -n "$READ_TOKEN"
          test -n "$ALLOWED_CONSUMER_REPOSITORY"
          test -n "$ALLOWED_DATA_REPOSITORY"
          test "$REQUESTED_CONSUMER_REPOSITORY" = "$ALLOWED_CONSUMER_REPOSITORY"
          test "$REQUESTED_DATA_REPOSITORY" = "$ALLOWED_DATA_REPOSITORY"
          [[ "$CONSUMER_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DATA_COMMIT" =~ ^[0-9a-f]{40}$ ]]

  equiframe-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    needs: preflight
    name: Build and test EquiFrame in isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out EquiFrame source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select candidate build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install hash-locked build controller
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r .github/controller-requirements.txt
      - name: Test repository helper command contracts
        run: python -m unittest discover -s tests -v
      - name: Test universality workflow evidence contracts
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Install locked core build environment
        working-directory: packages/equiframe
        run: uv sync --locked --all-extras --no-editable --python 3.12
      - name: Check universality workflow controllers
        run: |
          packages/equiframe/.venv/bin/ruff check --config packages/equiframe/pyproject.toml .github/scripts
          packages/equiframe/.venv/bin/ruff format --check --config packages/equiframe/pyproject.toml .github/scripts
          packages/equiframe/.venv/bin/mypy --config-file packages/equiframe/pyproject.toml \
            .github/scripts/prepare_universality_candidate.py \
            .github/scripts/collect_test_manifest.py \
            .github/scripts/run_universality_cell.py \
            .github/scripts/aggregate_universality.py \
            .github/scripts/test_universality_workflow.py
          packages/equiframe/.venv/bin/python -m py_compile .github/scripts/*.py
      - name: Check and build core once
        working-directory: packages/equiframe
        run: |
          uv run --locked --all-extras ruff check .
          uv run --locked --all-extras ruff format --check .
          uv run --locked --all-extras mypy --python-version 3.12
          uv run --locked --all-extras python tools/generate_assets.py --check
          uv run --locked --all-extras pytest -q
          uv run --locked --all-extras python -m build --no-isolation
          uv run --locked --all-extras twine check --strict dist/*
      - name: Install locked benchmark build environment
        working-directory: packages/equiframe-benchmark
        run: uv sync --locked --all-extras --no-editable --reinstall-package equiframe --python 3.12
      - name: Check and build benchmark once
        working-directory: packages/equiframe-benchmark
        run: |
          uv run --locked --all-extras ruff check .
          uv run --locked --all-extras ruff format --check .
          uv run --locked --all-extras mypy --python-version 3.12
          uv run --locked --all-extras python tools/generate_assets.py --check
          uv run --locked --all-extras pytest -q
          uv run --locked --all-extras python -m build --no-isolation
          uv run --locked --all-extras twine check --strict dist/*
      - name: Freeze exact test denominators and build outputs
        run: |
          mkdir -p _build-output/core-dist _build-output/benchmark-dist _build-output/test-manifests
          packages/equiframe/.venv/bin/python .github/scripts/collect_test_manifest.py \
            --source packages/equiframe --package equiframe \
            --output _build-output/test-manifests/equiframe.json
          packages/equiframe-benchmark/.venv/bin/python .github/scripts/collect_test_manifest.py \
            --source packages/equiframe-benchmark --package equiframe-benchmark \
            --output _build-output/test-manifests/equiframe-benchmark.json
          cp packages/equiframe/dist/* _build-output/core-dist/
          cp packages/equiframe-benchmark/dist/* _build-output/benchmark-dist/
      - name: Upload isolated EquiFrame build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-equiframe-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _build-output/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  consumer-build:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    needs:
      - preflight
      - equiframe-build
    name: Build independent consumer in isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out EquiFrame controller without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact independent consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer_repository }}
          ref: ${{ inputs.consumer_commit }}
          path: _external/consumer
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.UNIVERSALITY_READ_TOKEN }}
      - name: Select consumer build Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install hash-locked build controller
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r .github/controller-requirements.txt
      - name: Install the locked EquiFrame development environment
        working-directory: packages/equiframe
        run: uv sync --locked --all-extras --no-editable --python 3.12
      - name: Download immutable EquiFrame build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: universality-equiframe-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _frozen-equiframe
      - name: Build and inspect only the independent consumer
        working-directory: _external/consumer
        run: |
          "$GITHUB_WORKSPACE/packages/equiframe/.venv/bin/python" -m build --no-isolation
          "$GITHUB_WORKSPACE/packages/equiframe/.venv/bin/python" -m twine check --strict dist/*
          uv pip install \
            --python "$GITHUB_WORKSPACE/packages/equiframe/.venv/bin/python" \
            --no-index --no-deps --reinstall --link-mode copy \
            "$GITHUB_WORKSPACE"/_frozen-equiframe/core-dist/*.whl dist/*.whl
          "$GITHUB_WORKSPACE/packages/equiframe/.venv/bin/python" \
            "$GITHUB_WORKSPACE/.github/scripts/collect_test_manifest.py" \
            --source . --package equiframe-consumer-lab \
            --output "$GITHUB_WORKSPACE/consumer-test-manifest.json"
      - name: Freeze consumer-only outputs
        run: |
          mkdir -p _consumer-output/dist _consumer-output/test-manifests
          cp _external/consumer/dist/* _consumer-output/dist/
          cp consumer-test-manifest.json _consumer-output/test-manifests/equiframe-consumer-lab.json
      - name: Upload isolated consumer build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-consumer-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _consumer-output/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    needs:
      - preflight
      - equiframe-build
      - consumer-build
    name: Assemble one immutable candidate without executing external code
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out exact EquiFrame source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _source/equiframe
          persist-credentials: false
      - name: Check out exact independent consumer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer_repository }}
          ref: ${{ inputs.consumer_commit }}
          path: _source/consumer
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.UNIVERSALITY_READ_TOKEN }}
      - name: Check out exact frozen-data source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.consumer_data_repository }}
          ref: ${{ inputs.consumer_data_commit }}
          path: _source/consumer-data
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.UNIVERSALITY_READ_TOKEN }}
      - name: Select candidate assembler Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download isolated build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: universality-equiframe-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _frozen/equiframe
      - name: Download isolated consumer output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: universality-consumer-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: _frozen/consumer
      - name: Freeze artifact, source and public-data identities
        env:
          REPOSITORY_NAME: ${{ github.repository }}
          REPOSITORY_COMMIT: ${{ github.sha }}
          CONSUMER_REPOSITORY: ${{ inputs.consumer_repository }}
          CONSUMER_COMMIT: ${{ inputs.consumer_commit }}
          DATA_REPOSITORY: ${{ inputs.consumer_data_repository }}
          DATA_COMMIT: ${{ inputs.consumer_data_commit }}
          DATA_PATH: ${{ inputs.consumer_data_path }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          python _source/equiframe/.github/scripts/prepare_universality_candidate.py \
            --repository _source/equiframe \
            --repository-name "$REPOSITORY_NAME" \
            --repository-commit "$REPOSITORY_COMMIT" \
            --consumer-repository _source/consumer \
            --consumer-repository-name "$CONSUMER_REPOSITORY" \
            --consumer-commit "$CONSUMER_COMMIT" \
            --data-repository _source/consumer-data \
            --data-repository-name "$DATA_REPOSITORY" \
            --data-commit "$DATA_COMMIT" \
            --data-path "$DATA_PATH" \
            --core-dist _frozen/equiframe/core-dist \
            --benchmark-dist _frozen/equiframe/benchmark-dist \
            --consumer-dist _frozen/consumer/dist \
            --core-source _source/equiframe/packages/equiframe \
            --benchmark-source _source/equiframe/packages/equiframe-benchmark \
            --consumer-source _source/consumer \
            --core-test-manifest _frozen/equiframe/test-manifests/equiframe.json \
            --benchmark-test-manifest _frozen/equiframe/test-manifests/equiframe-benchmark.json \
            --consumer-test-manifest _frozen/consumer/test-manifests/equiframe-consumer-lab.json \
            --github-run-id "$WORKFLOW_RUN_ID" \
            --github-run-attempt "$WORKFLOW_RUN_ATTEMPT" \
            --github-repository "$REPOSITORY_NAME" \
            --github-workflow-ref "$WORKFLOW_REF" \
            --github-workflow-sha "$WORKFLOW_SHA" \
            --output candidate
      - name: Upload the one candidate used by every native cell
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  native-cell:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    needs: candidate
    name: ${{ matrix.cell }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - cell: linux-x64-py310
            os: ubuntu-24.04
            system: Linux
            architecture: x64
            python: '3.10'
          - cell: linux-x64-py311
            os: ubuntu-24.04
            system: Linux
            architecture: x64
            python: '3.11'
          - cell: linux-x64-py312
            os: ubuntu-24.04
            system: Linux
            architecture: x64
            python: '3.12'
          - cell: linux-x64-py313
            os: ubuntu-24.04
            system: Linux
            architecture: x64
            python: '3.13'
          - cell: linux-arm64-py310
            os: ubuntu-24.04-arm
            system: Linux
            architecture: arm64
            python: '3.10'
          - cell: linux-arm64-py311
            os: ubuntu-24.04-arm
            system: Linux
            architecture: arm64
            python: '3.11'
          - cell: linux-arm64-py312
            os: ubuntu-24.04-arm
            system: Linux
            architecture: arm64
            python: '3.12'
          - cell: linux-arm64-py313
            os: ubuntu-24.04-arm
            system: Linux
            architecture: arm64
            python: '3.13'
          - cell: windows-x64-py310
            os: windows-2022
            system: Windows
            architecture: x64
            python: '3.10'
          - cell: windows-x64-py311
            os: windows-2022
            system: Windows
            architecture: x64
            python: '3.11'
          - cell: windows-x64-py312
            os: windows-2022
            system: Windows
            architecture: x64
            python: '3.12'
          - cell: windows-x64-py313
            os: windows-2022
            system: Windows
            architecture: x64
            python: '3.13'
          - cell: macos-intel-py310
            os: macos-15-intel
            system: Darwin
            architecture: x64
            python: '3.10'
          - cell: macos-intel-py311
            os: macos-15-intel
            system: Darwin
            architecture: x64
            python: '3.11'
          - cell: macos-intel-py312
            os: macos-15-intel
            system: Darwin
            architecture: x64
            python: '3.12'
          - cell: macos-intel-py313
            os: macos-15-intel
            system: Darwin
            architecture: x64
            python: '3.13'
          - cell: macos-arm64-py310
            os: macos-15
            system: Darwin
            architecture: arm64
            python: '3.10'
          - cell: macos-arm64-py311
            os: macos-15
            system: Darwin
            architecture: arm64
            python: '3.11'
          - cell: macos-arm64-py312
            os: macos-15
            system: Darwin
            architecture: arm64
            python: '3.12'
          - cell: macos-arm64-py313
            os: macos-15
            system: Darwin
            architecture: arm64
            python: '3.13'
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Check out the exact source used to build the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the native interpreter
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Download the single immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: universality-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Install pinned cell controller tools
        run: python -m pip install --no-cache-dir --disable-pip-version-check -r .github/controller-requirements.txt
      - name: Execute the complete installed native cell
        working-directory: ${{ runner.temp }}
        run: >-
          python "${{ github.workspace }}/.github/scripts/run_universality_cell.py"
          --repository "${{ github.workspace }}"
          --candidate candidate
          --output evidence
          --attestation-output attestation
          --expected-python "${{ matrix.python }}"
          --expected-system "${{ matrix.system }}"
          --expected-architecture "${{ matrix.architecture }}"
          --cell-id "${{ matrix.cell }}"
          --deadline-seconds 19800
          --github-run-id "${{ github.run_id }}"
          --github-run-attempt "${{ github.run_attempt }}"
          --github-job "${{ github.job }}"
          --github-repository "${{ github.repository }}"
          --github-workflow-ref "${{ github.workflow_ref }}"
          --github-workflow-sha "${{ github.workflow_sha }}"
          --runner-name "${{ runner.name }}"
          --runner-os "${{ runner.os }}"
          --runner-arch "${{ runner.arch }}"
          --runner-environment "${{ runner.environment }}"
      - name: Upload receipts and every inventoried evidence file
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-cell-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
          include-hidden-files: true
          overwrite: true
      - name: Upload compact cell attestation for matrix aggregation
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-attestation-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/attestation/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          overwrite: true

  aggregate:
    if: always() && github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    needs:
      - candidate
      - native-cell
    name: Verify the fixed 20-cell denominator
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the matrix verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select verifier Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Download the immutable candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          name: universality-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate
      - name: Download every complete native cell evidence artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        continue-on-error: true
        with:
          pattern: universality-cell-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cells
          merge-multiple: false
      - name: Verify the candidate and fixed native denominator
        working-directory: ${{ runner.temp }}
        run: >-
          python "${{ github.workspace }}/.github/scripts/aggregate_universality.py"
          --candidate candidate
          --cells cells
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --github-repository "${{ github.repository }}"
          --github-workflow-ref "${{ github.workflow_ref }}"
          --github-workflow-sha "${{ github.workflow_sha }}"
          --candidate-job-result "${{ needs.candidate.result }}"
          --matrix-job-result "${{ needs['native-cell'].result }}"
          --output aggregate
      - name: Upload the consolidated matrix receipt
        if: always() && !cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: universality-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/aggregate/
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
          overwrite: true
