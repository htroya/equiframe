name: EquiFrame library and benchmark

on:
  workflow_dispatch:
    inputs:
      run_platform_matrix:
        description: 'Run the planned Python/platform matrix; consumes GitHub Actions minutes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: equiframe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix
    name: Python ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: x64
            python: '3.10'
          - os: ubuntu-24.04
            architecture: x64
            python: '3.11'
          - os: ubuntu-24.04
            architecture: x64
            python: '3.12'
          - os: ubuntu-24.04
            architecture: x64
            python: '3.13'
          - os: windows-2022
            architecture: x64
            python: '3.12'
          - os: macos-15-intel
            architecture: x64
            python: '3.12'
          - os: macos-15
            architecture: arm64
            python: '3.12'
          - os: ubuntu-24.04-arm
            architecture: arm64
            python: '3.10'
          - os: ubuntu-24.04-arm
            architecture: arm64
            python: '3.12'
    defaults:
      run:
        working-directory: packages/equiframe
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified upstream commit
        with:
          python-version: ${{ matrix.python }}
          architecture: ${{ matrix.architecture }}
      - name: Test repository helper command contracts
        if: runner.os == 'Linux'
        working-directory: .
        run: python -m unittest discover -s tests -v
      - name: Install pinned dependency manager
        run: python -m pip install uv==0.12.19
      - name: Install locked development environment
        run: uv sync --locked --all-extras --no-editable --python ${{ matrix.python }}
      - name: Check style
        run: uv run --locked --all-extras ruff check .
      - name: Check formatting
        run: uv run --locked --all-extras ruff format --check .
      - name: Check strict typing
        run: uv run --locked --all-extras mypy --python-version ${{ matrix.python }}
      - name: Check generated schemas and fixtures
        run: uv run --locked --all-extras python tools/generate_assets.py --check
      - name: Test contracts, native engines, detectors and hybrid decisions
        run: uv run --locked --all-extras pytest -q
      - name: Build wheel and sdist with locked backend
        run: uv run --locked --all-extras python -m build --no-isolation
      - name: Strict wheel and sdist metadata validation
        run: uv run --locked --all-extras twine check --strict dist/*
      - name: Verify base, ML, engines and wheel examples outside checkout
        run: uv run --locked --all-extras python tools/verify_distribution.py
      - name: Install locked benchmark environment
        working-directory: packages/equiframe-benchmark
        run: uv sync --locked --all-extras --no-editable --python ${{ matrix.python }}
      - name: Check benchmark style
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras ruff check .
      - name: Check benchmark formatting
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras ruff format --check .
      - name: Check benchmark typing
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras mypy --python-version ${{ matrix.python }}
      - name: Check benchmark schemas
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras python tools/generate_assets.py --check
      - name: Test oracle, calibration lineage, grouped splits and native pilot
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras pytest -q
      - name: Build benchmark wheel and sdist
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras python -m build --no-isolation
      - name: Strict benchmark metadata validation
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras twine check --strict dist/*
      - name: Verify pip installation and benchmark consumer outside checkout
        working-directory: packages/equiframe-benchmark
        run: uv run --locked --all-extras python tools/verify_distribution.py
