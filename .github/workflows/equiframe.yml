name: EquiFrame foundations

on:
  push:
    branches: [main, hernan/step-01-foundations]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: equiframe-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python 3.12 / ${{ matrix.os }} / x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    defaults:
      run:
        working-directory: packages/equiframe
    env:
      PYTHONUTF8: '1'
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4, verified upstream commit
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5, verified upstream commit
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install pinned dependency manager
        run: python -m pip install --no-deps uv==0.11.6
      - name: Install locked development environment
        run: uv sync --locked --python 3.12
      - name: Check style
        run: uv run --locked ruff check .
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Check strict typing
        run: uv run --locked mypy
      - name: Check generated schemas and fixtures
        run: uv run --locked python tools/generate_assets.py --check
      - name: Test contract API and CLI
        run: uv run --locked pytest -q
      - name: Build wheel and sdist with locked backend
        run: uv run --locked python -m build --no-isolation
      - name: Verify clean wheel and reproducible sdist rebuild
        run: uv run --locked python tools/verify_distribution.py
