name: Build identified release candidate

on:
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Explicitly run candidate validation; consumes Actions minutes; never publishes'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.run_build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps uv==0.11.6
      - name: Validate and build core
        working-directory: packages/equiframe
        run: |
          python tools/check_candidate.py --output dist/checks.json
      - name: Validate and build benchmark
        working-directory: packages/equiframe-benchmark
        run: |
          python ../equiframe/tools/check_candidate.py --package . --output dist/checks.json
      - name: Identify built bytes without publication
        working-directory: packages/equiframe
        run: |
          uv run --locked --all-extras python tools/release_manifest.py --checks dist/checks.json --commit "$GITHUB_SHA" --output dist/core-manifest.json
          uv run --locked --all-extras python tools/release_manifest.py --package ../equiframe-benchmark --checks ../equiframe-benchmark/dist/checks.json --commit "$GITHUB_SHA" --output ../equiframe-benchmark/dist/benchmark-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: equiframe-candidate-${{ github.sha }}
          path: |
            packages/equiframe/dist/
            packages/equiframe-benchmark/dist/
          if-no-files-found: error
          retention-days: 14
