test:
  commands:
    - R -h
    - R --version
    - R -e 'print(.Platform$dynlib.ext)' | grep -F -- ".so"
    - Rscript --version
    - Rscript -e 'cat("ok\n")' | grep -xF ok
    - xvfb-run Rscript -e "library('tcltk');quit(status=is.logical(tclRequire('Tktable')))"
    - R -e "capabilities()"
    - R -e "grSoftVersion()"
    - env | R -s -e "env <- Sys.getenv(names=TRUE); writeLines(setdiff(paste(names(env),
      env, sep='='), readLines(file('stdin'))))"
    - R CMD config --all
    - Rscript test-svg.R
    - Rscript -e "stopifnot(capabilities('jpeg'), TRUE)"
    - Rscript -e "stopifnot(capabilities('png'), TRUE)"
    - R -e "options(warn=2);Sys.time()"
    - R -e "stopifnot(strtoi(substr(attr(OlsonNames(), 'Version'), 1, 4)) >= 2024)"
  files:
    - test-svg.R
