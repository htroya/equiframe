CI: github_actions
CONDA_BUILD_SKIP_TESTS: '0'
bzip2: '1'
c_compiler: vs2022
cairo: '1'
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: vs2022
extend_keys:
- extend_keys
- ignore_build_only_deps
- ignore_version
- pin_run_as_build
fontconfig: '2'
fortran_compiler: gfortran
freetype: '2'
gsl: '2.8'
icu: '78'
ignore_build_only_deps:
- python
- numpy
libblas: 3.9.* *netlib
libcurl: '8'
libdeflate: '1.26'
libiconv: '1'
libjpeg_turbo: '3'
liblapack: 3.9.* *netlib
liblzma_devel: '5'
libpng: '1.6'
libtiff: '4.7'
lua: '5'
m2w64_c_compiler: gcc
m2w64_c_compiler_version: '15'
m2w64_c_stdlib: m2w64-sysroot
m2w64_c_stdlib_version: '12'
m2w64_cxx_compiler: gxx
m2w64_cxx_compiler_version: '15'
m2w64_fortran_compiler: gfortran
m2w64_fortran_compiler_version: '15'
numpy: '1.26'
pcre2: '10.49'
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: '3.14'
r_base: '3.4'
target_platform: win-64
tk: '8.6'
vc: '14'
zlib: '1'
