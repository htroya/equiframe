test:
  commands:
    - echo on
    - R -h
    - R --version
    - R -e "print(.Platform$dynlib.ext)" | findstr "/C:%SHLIB_EXT%"
    - Rscript --version
    - Rscript -e "cat('ok\n')" | findstr /X "/C:ok"
    - Rscript -e "library('tcltk');quit(status=is.logical(tclRequire('Tktable')))"
    - R -e "capabilities()"
    - R -e "grSoftVersion()"
    - set | R -s -e "env <- Sys.getenv(names=TRUE); writeLines(setdiff(paste(names(env),
      env, sep='='), readLines(file('stdin'))))"
    - R CMD config --all
    - open
    - Rfe --help
    - Rterm --help
    - Rterm --version
    - Rscript -e "stopifnot(capabilities('jpeg'), TRUE)"
    - Rscript -e "stopifnot(capabilities('png'), TRUE)"
    - if not exist %PREFIX%\\Lib\\R\\bin\\x64\\R.lib exit 1
    - if not exist %PREFIX%\\Lib\\R\\bin\\x64\\Rblas.lib exit 1
    - if not exist %PREFIX%\\Lib\\R\\bin\\x64\\Rlapack.lib exit 1
    - R -e "options(warn=2);Sys.time()"
    - R -e "stopifnot(strtoi(substr(attr(OlsonNames(), 'Version'), 1, 4)) >= 2024)"
  files:
