CI: github_actions
CONDA_BUILD_SKIP_TESTS: '0'
blas_default_impl: mkl
blas_impl: openblas
blas_impl_lib: openblas.dll
c_compiler: clang
c_stdlib: vs
channel_sources: conda-forge
channel_targets: conda-forge main
cpu_optimization_target: nocona
cran_mirror: https://cran.r-project.org
cxx_compiler: clangxx
extend_keys:
- ignore_version
- ignore_build_only_deps
- pin_run_as_build
- extend_keys
fortran_compiler: flang
fortran_compiler_version: '21'
ignore_build_only_deps:
- python
- numpy
lapack_impl_lib: openblas.dll
libblas: 3.9.* *netlib
libcblas: 3.9.* *netlib
liblapack: 3.9.* *netlib
liblapacke: 3.9.* *netlib
lua: '5'
numpy: '2'
openblas: 0.3.*
perl: 5.26.2
pin_run_as_build:
  python:
    max_pin: x.x
    min_pin: x.x
  r-base:
    max_pin: x.x
    min_pin: x.x
python: '3.14'
r_base: '3.4'
target_platform: win-64
vc: '14'
zip_keys:
- - blas_impl
  - blas_impl_lib
  - lapack_impl_lib
