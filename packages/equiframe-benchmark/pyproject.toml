[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "equiframe-benchmark"
version = "0.7.0"
description = "Independent oracle reviews and provenance-aware benchmark partitions for EquiFrame"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hernán Troya" }]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
dependencies = ["equiframe[arrow]==0.7.0"]

[project.urls]
Repository = "https://github.com/htroya/equiframe"
Documentation = "https://github.com/htroya/equiframe/blob/main/docs/STEP_06_DESIGN.md"

[project.scripts]
equiframe-benchmark-pilot = "equiframe_benchmark.pilot:main"

[project.optional-dependencies]
engines = ["equiframe[engines]==0.7.0"]

[tool.uv.sources]
equiframe = { path = "../equiframe" }

[dependency-groups]
dev = ["build>=1.3,<2", "hatchling==1.28.0", "pytest>=8.4,<10", "hypothesis>=6.140,<7", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/equiframe_benchmark"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/schemas", "/pyproject.toml", "/uv.lock", "/README.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pandas", "polars", "duckdb"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
