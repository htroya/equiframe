[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "equiframe"
version = "0.11.0"
description = "Operational verification, native ETL migration and portable semantic evidence"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hernán Troya" }]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3.12", "Typing :: Typed"]
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "tzdata>=2025.2"]

[project.urls]
Repository = "https://github.com/htroya/equiframe"
Documentation = "https://github.com/htroya/equiframe/blob/main/packages/equiframe/README.md"

[project.optional-dependencies]
ml = ["scikit-learn>=1.7,<1.10", "numpy>=2,<3"]
arrow = ["pyarrow>=20,<26"]
pandas = ["pandas>=2.2,<4", "pyarrow>=20,<26"]
polars = ["polars>=1.30,<2", "pyarrow>=20,<26"]
duckdb = ["duckdb>=1.5.6,<2", "pyarrow>=20,<26"]
engines = ["pandas>=2.2,<4", "polars>=1.30,<2", "duckdb>=1.5.6,<2", "pyarrow>=20,<26"]

[project.scripts]
equiframe = "equiframe.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling==1.28.0",
  "hypothesis>=6.140,<7",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
  "pandas-stubs>=2.2,<4",
  "twine>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equiframe"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/schemas", "/tools", "/pyproject.toml", "/uv.lock", "/README.md", "/CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
