[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "equiframe"
version = "0.1.0"
description = "Strict, versioned semantic contracts for tabular transformations"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Hernán Troya" }]
dependencies = ["pydantic>=2.12,<3", "typer>=0.20,<1", "tzdata>=2025.2"]

[project.scripts]
equiframe = "equiframe.cli:main"

[dependency-groups]
dev = [
  "build>=1.3,<2",
  "hatchling==1.28.0",
  "hypothesis>=6.140,<7",
  "jsonschema>=4.25,<5",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/equiframe"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/schemas", "/tools", "/pyproject.toml", "/uv.lock", "/README.md", "/CHANGELOG.md"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --basetemp=.pytest-tmp"
